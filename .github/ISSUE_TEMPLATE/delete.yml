name: Delete a plugin
description: Remove your plugin from the hub. An administrator confirms it; the ID stays reserved for you.
title: "Delete a plugin"
labels: [delete]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin ID
      description: The plugin's ID, such as lumen.todo.
      placeholder: publisher.name
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: false
