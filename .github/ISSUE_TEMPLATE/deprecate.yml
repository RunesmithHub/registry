name: Deprecate a plugin
description: Mark your plugin as no longer maintained, optionally naming a replacement.
title: "Deprecate a plugin"
labels: [deprecate]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin ID
      description: The plugin's ID, such as lumen.todo.
      placeholder: publisher.name
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Shown on the plugin's page, at most 200 characters.
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Replacement plugin ID
      description: Optional. A plugin users should move to.
    validations:
      required: false
