name: Transfer a plugin
description: Move your plugin to another publisher. Both publishers confirm in the issue.
title: "Transfer a plugin"
labels: [transfer]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin ID
      description: The plugin's ID, such as lumen.todo.
      placeholder: publisher.name
    validations:
      required: true
  - type: input
    id: publisher
    attributes:
      label: New publisher
      description: The name of the publisher that takes over the plugin.
    validations:
      required: true
