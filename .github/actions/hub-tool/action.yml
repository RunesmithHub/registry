name: Hub tool
description: Builds rshub from RunesmithHub/hub at the commit pinned in .github/hub-tool.env, which must be on the hub's main branch, and puts it on the PATH.

runs:
  using: composite
  steps:
    - name: Read the pinned commit
      id: pin
      shell: bash
      run: |
        ref="$(sed -n 's/^HUB_TOOL_REF=\([0-9a-f]\{40\}\)$/\1/p' .github/hub-tool.env)"
        if [ -z "$ref" ]; then
          echo "::error file=.github/hub-tool.env::HUB_TOOL_REF must be a full commit SHA."
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Check out the hub tool
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: RunesmithHub/hub
        ref: ${{ steps.pin.outputs.ref }}
        path: .hub-tool/source
        fetch-depth: 0
        persist-credentials: false

    - name: Check the pinned commit is on the hub's main branch
      shell: bash
      env:
        REF: ${{ steps.pin.outputs.ref }}
      run: |
        if ! git -C .hub-tool/source merge-base --is-ancestor "$REF" refs/remotes/origin/main; then
          echo "::error file=.github/hub-tool.env::HUB_TOOL_REF $REF is not on the main branch of RunesmithHub/hub."
          exit 1
        fi

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: .hub-tool/source/global.json

    - name: Build the tool
      shell: bash
      run: dotnet publish .hub-tool/source/src/RunesmithHub.Tool/RunesmithHub.Tool.csproj --configuration Release --output .hub-tool/bin

    - name: Put the tool on the PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.hub-tool/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env] a fixed path inside the workspace
