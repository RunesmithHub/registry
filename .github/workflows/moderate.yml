# Signs a new moderation list when moderation entries change, withdraws what is hosted for blocked versions, and signs the timestamp,
# committing to the index branch, which the deploy-index workflow puts on GitHub Pages. The moderate job waits for an administrator's
# approval.
name: Moderate

on:
  push:
    branches: [main]
    paths:
      - moderation/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: moderate
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  moderate:
    name: Sign the moderation list
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: moderate
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      # The package is checked against the SHA-512 nuget.org lists for it and installed from a folder that is the only package source.
      - name: Install Sleet
        env:
          SLEET_VERSION: 7.2.0
          SLEET_SHA512: 7f0ead4b6eef92d3d84b2ad30d54815688f2c5402d4acd58023e8eb4c312f69ffd10eecf8f54e21262643da29b41fb550f2d9168589d9695a970636783a9f67a
        run: |
          source="$RUNNER_TEMP/sleet-source"
          mkdir -p "$source"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$source/sleet.$SLEET_VERSION.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/sleet/$SLEET_VERSION/sleet.$SLEET_VERSION.nupkg"
          echo "$SLEET_SHA512  $source/sleet.$SLEET_VERSION.nupkg" | sha512sum --check --strict --quiet
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="sleet" value="%s" />\n  </packageSources>\n</configuration>\n' "$source" > "$source/nuget.config"
          NUGET_PACKAGES="$RUNNER_TEMP/sleet-packages" dotnet tool install sleet --version "$SLEET_VERSION" --tool-path "$RUNNER_TEMP/sleet" --configfile "$source/nuget.config"
          echo "$RUNNER_TEMP/sleet" >> "$GITHUB_PATH"

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: registry,packages
          permission-contents: write

      - name: Get the bot's token for the index branch
        id: index-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Sign the moderation list and commit it to the index branch
        env:
          INDEX_TOKEN: ${{ steps.index-app.outputs.token }}
          INDEX_DEPLOY_KEY: ${{ secrets.HUB_INDEX_DEPLOY_KEY }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_MODERATION_KEY: ${{ secrets.HUB_MODERATION_KEY }}
        run: bash .github/scripts/commit-index.sh "Sign a new moderation list" rshub index moderate --registry . --index index/site

      - name: Withdraw the files of blocked versions
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          HUB_FEED_URL: ${{ vars.HUB_FEED_URL }}
          HUB_FEED_ACCOUNT_ID: ${{ vars.HUB_FEED_ACCOUNT_ID }}
          HUB_FEED_BUCKET: ${{ vars.HUB_FEED_BUCKET }}
          HUB_FEED_ACCESS_KEY_ID: ${{ secrets.HUB_FEED_ACCESS_KEY_ID }}
          HUB_FEED_SECRET_ACCESS_KEY: ${{ secrets.HUB_FEED_SECRET_ACCESS_KEY }}
          # R2 rejects the whole-object checksums the AWS SDK adds to multipart uploads.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: rshub publish withdraw --registry .

  timestamp:
    name: Sign the timestamp
    needs: moderate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: timestamp
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Sign the timestamp and commit it to the index branch
        env:
          INDEX_TOKEN: ${{ steps.app.outputs.token }}
          INDEX_DEPLOY_KEY: ${{ secrets.HUB_INDEX_DEPLOY_KEY }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_TIMESTAMP_KEY: ${{ secrets.HUB_TIMESTAMP_KEY }}
        run: bash .github/scripts/commit-index.sh "Sign a new timestamp" rshub index timestamp --registry . --index index/site
