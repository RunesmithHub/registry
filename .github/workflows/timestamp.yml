# Re-signs the timestamp every day so clients can tell the index is current, and commits it to the index branch. Signs nothing else and
# runs unattended.
name: Timestamp

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: timestamp
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  refresh:
    name: Refresh the timestamp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: timestamp
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool
        with:
          cache: "false"

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Re-sign the timestamp and commit it to the index branch
        env:
          INDEX_TOKEN: ${{ steps.app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_TIMESTAMP_KEY: ${{ secrets.HUB_TIMESTAMP_KEY }}
        run: bash .github/scripts/commit-index.sh "Refresh the timestamp" rshub index refresh --registry . --index index/site
