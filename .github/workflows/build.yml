# Builds one release where it cannot hurt anything, twice, compares the builds, analyses the result with the hub tool only, and proposes
# the version record. Called by discovery for each new release, or run by hand with the same job description.
name: Build

on:
  workflow_call:
    inputs:
      job:
        description: The build job from rshub discover, as JSON.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      job:
        description: The build job from rshub discover, as JSON.
        required: true
        type: string

permissions: {}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  HUB_INDEX_URL: https://runesmithhub.github.io/registry/
  HUB_FEED_URL: ${{ vars.HUB_FEED_URL }}
  SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.401@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317

jobs:
  build:
    name: Build (${{ matrix.output }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        output: [package, rebuild]
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool
        with:
          cache: "false"

      - name: Read the build job
        id: job
        uses: ./.github/actions/build-job
        with:
          job: ${{ inputs.job }}

      - name: Check out the plugin at the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.job.outputs.repository }}
          ref: ${{ steps.job.outputs.commit }}
          path: plugin
          persist-credentials: false
          submodules: false

      - name: Validate the source and plan the build
        id: plan
        env:
          PLUGIN: ${{ steps.job.outputs.plugin }}
          TAG: ${{ steps.job.outputs.tag }}
          COMMIT: ${{ steps.job.outputs.commit }}
        run: |
          find plugin -name global.json -not -path 'plugin/.git/*' -delete
          rshub build prepare --source plugin --registration "plugins/$PLUGIN/registration.json" --tag "$TAG" --commit "$COMMIT" --output "$RUNNER_TEMP/hub-build"

      - name: Check the build image has the planned SDK
        env:
          DOTNET_SDK: ${{ steps.plan.outputs.dotnet-sdk }}
        run: |
          actual="$(docker run --rm "$SDK_IMAGE" dotnet --version)"
          if [ "$actual" != "$DOTNET_SDK" ]; then
            echo "::error::The build image has .NET SDK $actual, but the plan needs $DOTNET_SDK. Update SDK_IMAGE."
            exit 1
          fi

      # Plugin code runs only inside these containers; the build has no network, and neither can change the Git data or the hub tool.
      - name: Restore in a container
        env:
          ROOT: ${{ steps.plan.outputs.plugin-root }}
          PROJECT: ${{ steps.plan.outputs.implementation }}
          PROPERTIES: ${{ steps.plan.outputs.properties }}
        run: |
          mkdir -p "$RUNNER_TEMP/nuget"
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env DOTNET_CLI_TELEMETRY_OPTOUT=1 --env DOTNET_NOLOGO=1 \
            --env NUGET_PACKAGES="$RUNNER_TEMP/nuget" --volume "$RUNNER_TEMP/nuget:$RUNNER_TEMP/nuget" \
            --volume "$PWD/plugin:$PWD/plugin" --volume "$PWD/plugin/.git:$PWD/plugin/.git:ro" \
            --volume "$RUNNER_TEMP/hub-build:$RUNNER_TEMP/hub-build:ro" --workdir "$ROOT" \
            "$SDK_IMAGE" dotnet restore "$PROJECT" "@$PROPERTIES"

      - name: Build in a container without network
        env:
          ROOT: ${{ steps.plan.outputs.plugin-root }}
          PROJECT: ${{ steps.plan.outputs.implementation }}
          PROPERTIES: ${{ steps.plan.outputs.properties }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp --env DOTNET_CLI_TELEMETRY_OPTOUT=1 --env DOTNET_NOLOGO=1 \
            --env NUGET_PACKAGES="$RUNNER_TEMP/nuget" --volume "$RUNNER_TEMP/nuget:$RUNNER_TEMP/nuget:ro" \
            --volume "$PWD/plugin:$PWD/plugin" --volume "$PWD/plugin/.git:$PWD/plugin/.git:ro" \
            --volume "$RUNNER_TEMP/hub-build:$RUNNER_TEMP/hub-build:ro" --workdir "$ROOT" \
            "$SDK_IMAGE" dotnet build "$PROJECT" --no-restore "@$PROPERTIES"

      - name: Assemble the package
        env:
          PLUGIN: ${{ steps.job.outputs.plugin }}
          COMMIT: ${{ steps.job.outputs.commit }}
          ROOT: ${{ steps.plan.outputs.plugin-root }}
          DOTNET_SDK: ${{ steps.plan.outputs.dotnet-sdk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rshub build package --source "$ROOT" --output output --commit "$COMMIT" --run "$RUN_URL" \
            --registration "plugins/$PLUGIN/registration.json" --sdk "$DOTNET_SDK"

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.output }}
          path: output

  compare:
    name: Compare the builds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Download both builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{package,rebuild}"
          path: builds

      - name: Compare the file hashes
        run: rshub build compare builds/package/hashes.json builds/rebuild/hashes.json

  analyse:
    name: Analyse
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: bot
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Read the build job
        id: job
        uses: ./.github/actions/build-job
        with:
          job: ${{ inputs.job }}

      - name: Check out the plugin's source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.job.outputs.repository }}
          ref: ${{ steps.job.outputs.commit }}
          path: plugin
          persist-credentials: false
          submodules: false

      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Download the previous version
        id: previous
        env:
          JOB_FILE: ${{ steps.job.outputs.file }}
        run: rshub version previous --build "$JOB_FILE" --registry . --current "$HUB_INDEX_URL" --out "$RUNNER_TEMP/previous"

      - name: Analyse the build output
        env:
          PLUGIN: ${{ steps.job.outputs.plugin }}
          VERSION: ${{ steps.job.outputs.version }}
          COMMIT: ${{ steps.job.outputs.commit }}
          JOB_FILE: ${{ steps.job.outputs.file }}
          PREVIOUS: ${{ steps.previous.outputs.package }}
          HUB_HEURISTICS: ${{ secrets.HUB_HEURISTICS }}
          HUB_FINDINGS_RECIPIENT: ${{ vars.HUB_FINDINGS_RECIPIENT }}
        run: |
          args=(--package "package/$PLUGIN-$VERSION.rsplugin" --registration "plugins/$PLUGIN/registration.json" --source plugin --commit "$COMMIT" --output analysis)
          if [ -n "$PREVIOUS" ]; then args+=(--previous "$PREVIOUS"); fi
          if [ -n "$HUB_HEURISTICS" ]; then
            rules="$(mktemp)"
            printf '%s' "$HUB_HEURISTICS" > "$rules"
            export HUB_HEURISTICS_FILE="$rules"
          fi
          unset HUB_HEURISTICS
          status=0
          rshub analyse "${args[@]}" || status=$?
          if [ -n "${rules:-}" ]; then rm -f "$rules"; fi
          rm -f analysis/private-findings.json
          cp "$JOB_FILE" analysis/build-info.json
          if [ -s analysis/analysis.json ]; then status=0; fi
          exit "$status"

      - name: Upload the public analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis
          path: |
            analysis/analysis.json
            analysis/summary.md
            analysis/build-info.json
            analysis/sbom.cdx.json

      - name: Upload the sealed review findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-findings
          path: analysis/private-findings.sealed.json
          retention-days: 7
          if-no-files-found: ignore

  propose:
    name: Propose the version
    needs: analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Download the analysis and the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{analysis,package}"
          path: results

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Propose the version or reject it
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          rshub version propose --analysis results/analysis --build results/analysis/build-info.json --package results/package \
            --registry . --current "$HUB_INDEX_URL"

  report-failure:
    name: Report a failed build
    needs: [build, compare, analyse, propose]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: bot
    permissions: {}
    steps:
      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-issues: write

      - name: Reject the version on its tracking issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ fromJSON(inputs.job).trackingIssue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '<!-- rejected: the build or its checks failed. -->\n**Rejected:** the build or its checks failed. The [build run](%s) shows which step failed and why.\n\nFix the problem and release a new version number.\n' "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label rejected
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
