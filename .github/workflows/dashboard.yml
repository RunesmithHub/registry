# Writes the moderation dashboard into the index branch every hour. Uses no signing key and changes nothing else in the index.
name: Dashboard

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dashboard:
    name: Build the dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Get the bot's token for the index branch
        id: index-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Write the dashboard and commit it to the index branch
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          INDEX_TOKEN: ${{ steps.index-app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: bash .github/scripts/commit-index.sh "Update the dashboard" rshub dashboard --registry . --index index/site
