# Writes the moderation dashboard into the index branch every hour: one job builds it with read-only access, another commits only that file.
name: Dashboard

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build the dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    outputs:
      bot-login: ${{ steps.app.outputs.app-slug }}[bot]
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Write the dashboard
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: rshub dashboard --registry . --index index/site

      - name: Upload the dashboard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: index/site/dashboard.json
          retention-days: 1
          if-no-files-found: error

  push:
    name: Commit the dashboard to the index branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: timestamp
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Download the dashboard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard
          path: ${{ runner.temp }}/dashboard

      - name: Commit the dashboard to the index branch
        env:
          INDEX_DEPLOY_KEY: ${{ secrets.HUB_INDEX_DEPLOY_KEY }}
          HUB_BOT_LOGIN: ${{ needs.build.outputs.bot-login }}
          DASHBOARD: ${{ runner.temp }}/dashboard/dashboard.json
        run: |
          test -f "$DASHBOARD" && test ! -L "$DASHBOARD"
          jq -e "type == \"object\"" "$DASHBOARD" > /dev/null
          bash .github/scripts/commit-index.sh "Update the dashboard" cp "$DASHBOARD" index/site/dashboard.json
