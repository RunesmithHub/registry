# Deploys the index branch to GitHub Pages, newest push first, and rebuilds the website. A push runs the index branch's own copy of this
# file, so the copy there must stay the same as this one.
name: Deploy index

on:
  push:
    branches: [index]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the index
    if: github.ref == 'refs/heads/index'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Rebuild the website
        env:
          HUB_SITE_DEPLOY_HOOK: ${{ secrets.HUB_SITE_DEPLOY_HOOK }}
        run: |
          if [ -n "$HUB_SITE_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$HUB_SITE_DEPLOY_HOOK" > /dev/null
          fi
