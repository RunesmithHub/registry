# Publishes what merged to the default branch: releases the approved versions, signs a new snapshot, then the timestamp, each committed
# to the index branch, which the deploy-index workflow puts on GitHub Pages. The publish job waits for an administrator's approval;
# merges that arrive meanwhile are published in the same batch.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - plugins/**
      - publishers/**
      - policy/**
      - keys/root/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  publish:
    name: Release and sign the snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bootstrap: ${{ steps.index.outputs.bootstrap }}
      count: ${{ steps.artifacts.outputs.count }}
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      # The package is checked against the SHA-512 nuget.org lists for it and installed from a folder that is the only package source.
      - name: Install Sleet
        env:
          SLEET_VERSION: 7.2.0
          SLEET_SHA512: 7f0ead4b6eef92d3d84b2ad30d54815688f2c5402d4acd58023e8eb4c312f69ffd10eecf8f54e21262643da29b41fb550f2d9168589d9695a970636783a9f67a
        run: |
          source="$RUNNER_TEMP/sleet-source"
          mkdir -p "$source"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$source/sleet.$SLEET_VERSION.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/sleet/$SLEET_VERSION/sleet.$SLEET_VERSION.nupkg"
          echo "$SLEET_SHA512  $source/sleet.$SLEET_VERSION.nupkg" | sha512sum --check --strict --quiet
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="sleet" value="%s" />\n  </packageSources>\n</configuration>\n' "$source" > "$source/nuget.config"
          NUGET_PACKAGES="$RUNNER_TEMP/sleet-packages" dotnet tool install sleet --version "$SLEET_VERSION" --tool-path "$RUNNER_TEMP/sleet" --configfile "$source/nuget.config"
          echo "$RUNNER_TEMP/sleet" >> "$GITHUB_PATH"

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: registry,packages
          permission-actions: read
          permission-contents: write
          permission-members: read
          permission-pull-requests: read
          permission-issues: read

      - name: Release the approved versions
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_FEED_URL: ${{ vars.HUB_FEED_URL }}
          HUB_FEED_ACCOUNT_ID: ${{ vars.HUB_FEED_ACCOUNT_ID }}
          HUB_FEED_BUCKET: ${{ vars.HUB_FEED_BUCKET }}
          HUB_FEED_ACCESS_KEY_ID: ${{ secrets.HUB_FEED_ACCESS_KEY_ID }}
          HUB_FEED_SECRET_ACCESS_KEY: ${{ secrets.HUB_FEED_SECRET_ACCESS_KEY }}
          # R2 rejects the whole-object checksums the AWS SDK adds to multipart uploads.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          mkdir -p "$RUNNER_TEMP/publications"
          rshub publish artifacts --registry . --index index/site --work "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/publications/publications.json"

      - name: Attest the packages
        if: steps.artifacts.outputs.count != '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/artifacts/**/*.rsplugin

      - name: Get the bot's token for the index branch
        id: index-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Sign the snapshot and commit it to the index branch
        id: index
        env:
          INDEX_TOKEN: ${{ steps.index-app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_PUBLISH_KEY: ${{ secrets.HUB_PUBLISH_KEY }}
        run: |
          bash .github/scripts/commit-index.sh "Sign a new snapshot" \
            rshub index publish --registry . --index index/site --publications "$RUNNER_TEMP/publications/publications.json"

      - name: Upload the publications
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publications
          path: ${{ runner.temp }}/publications
          retention-days: 7

  bootstrap-moderation:
    name: Sign the first moderation list
    needs: publish
    if: needs.publish.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: moderate
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Sign the moderation list and commit it to the index branch
        env:
          INDEX_TOKEN: ${{ steps.app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_MODERATION_KEY: ${{ secrets.HUB_MODERATION_KEY }}
        run: bash .github/scripts/commit-index.sh "Sign a new moderation list" rshub index moderate --registry . --index index/site

  timestamp:
    name: Sign the timestamp
    needs: [publish, bootstrap-moderation]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.bootstrap-moderation.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: timestamp
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the index branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: index
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-contents: write

      - name: Sign the timestamp and commit it to the index branch
        env:
          INDEX_TOKEN: ${{ steps.app.outputs.token }}
          HUB_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          HUB_TIMESTAMP_KEY: ${{ secrets.HUB_TIMESTAMP_KEY }}
        run: bash .github/scripts/commit-index.sh "Sign a new timestamp" rshub index timestamp --registry . --index index/site

  announce:
    name: Announce the published versions
    needs: [publish, timestamp]
    if: ${{ !cancelled() && needs.timestamp.result == 'success' && needs.publish.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the hub tool
        uses: ./.github/actions/hub-tool

      - name: Download the publications
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publications
          path: ${{ runner.temp }}/publications

      - name: Get the bot's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HUB_BOT_APP_ID }}
          private-key: ${{ secrets.HUB_BOT_KEY }}
          permission-issues: write

      - name: Comment on and close the tracking issues
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: rshub publish announce --publications "$RUNNER_TEMP/publications/publications.json"
